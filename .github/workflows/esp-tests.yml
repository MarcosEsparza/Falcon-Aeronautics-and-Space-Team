name: ESP quality checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: esp-design-intelligence
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            esp-design-intelligence/requirements.txt
            esp-design-intelligence/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint Python sources with Ruff
        run: ruff check --output-format=github .
      - name: Audit installed Python dependencies
        run: python -m pip_audit --local
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Compile Python sources
        run: python -m compileall -q app.py engineering.py history.py tests tools
      - name: Run tests
        run: python -m pytest -q
      - name: Start Streamlit
        run: |
          cd ..
          python -m streamlit run esp-design-intelligence/app.py --server.headless true --server.address 127.0.0.1 --server.port 8501 > /tmp/esp-streamlit.log 2>&1 &
          echo $! > /tmp/esp-streamlit.pid
      - name: Verify startup and capture screenshots
        run: python tests/capture_screenshots.py
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: esp-browser-screenshots
          path: esp-design-intelligence/artifacts/screenshots/
          if-no-files-found: warn
          retention-days: 14
      - name: Show Streamlit log on failure
        if: failure()
        run: |
          if [ -f /tmp/esp-streamlit.log ]; then
            cat /tmp/esp-streamlit.log
          else
            echo "Streamlit was not started before this failure."
          fi

  credential-scan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject newly committed data-like files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python esp-design-intelligence/tools/check_repository_data.py --compare "$BASE_SHA" "$HEAD_SHA"
      - name: Scan PR commits without printing candidate credentials
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set +e
          docker run --rm -v "$PWD:/repo:ro" -w /repo \
            ghcr.io/trufflesecurity/trufflehog:3.97.9 \
            git file:///repo/ --since-commit "$BASE_SHA" --branch "$HEAD_SHA" \
            --no-verification --results=unverified --fail --fail-on-scan-errors --no-update \
            --json > /tmp/esp-secret-findings.json 2> /tmp/esp-secret-scanner.log
          result=$?
          if [ "$result" -eq 183 ]; then
            echo "::error::Potential credentials found. Review locally; findings are withheld from public CI logs."
            exit 1
          elif [ "$result" -ne 0 ]; then
            echo "::error::Credential scan could not complete (exit $result)."
            exit 1
          fi
          echo "No credential-shaped findings in the scanned PR commits."
